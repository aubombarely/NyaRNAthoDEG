<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#0d0a1f"/>
      <stop offset="100%" stop-color="#04020a"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textglow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="196" fill="#04020a"/>
  <circle cx="200" cy="200" r="185" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="192" fill="none" stroke="#1a0a30" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="186" fill="none" stroke="#0d0520" stroke-width="0.6"/>

  <!-- Stars (lavender-tinted) -->
  <g fill="#ccbbff" opacity="0.38">
    <circle cx="65"  cy="80"  r="1"/>
    <circle cx="338" cy="65"  r="1.5"/>
    <circle cx="78"  cy="322" r="1"/>
    <circle cx="352" cy="312" r="1.5"/>
    <circle cx="110" cy="360" r="1"/>
    <circle cx="296" cy="365" r="1"/>
    <circle cx="50"  cy="210" r="1"/>
    <circle cx="375" cy="180" r="1"/>
    <circle cx="316" cy="44"  r="1"/>
    <circle cx="148" cy="40"  r="1.5"/>
    <circle cx="38"  cy="150" r="1"/>
    <circle cx="364" cy="250" r="1"/>
    <circle cx="85"  cy="158" r="0.8"/>
    <circle cx="325" cy="152" r="0.8"/>
    <circle cx="58"  cy="268" r="1"/>
    <circle cx="355" cy="135" r="1"/>
  </g>

  <!-- ── Nyarlathotep: the Dark Eye ─────────────────────────────────────── -->
  <!-- Outer aura / void -->
  <ellipse cx="200" cy="72" rx="44" ry="30"
           fill="#0a0420" filter="url(#softglow)" opacity="0.8"/>
  <!-- Sclera -->
  <ellipse cx="200" cy="72" rx="38" ry="24"
           fill="#0c0528" stroke="#3a1a60" stroke-width="2.8" filter="url(#glow)"/>
  <!-- Iris rings -->
  <ellipse cx="200" cy="72" rx="24" ry="18"
           fill="#080320" stroke="#5a2a90" stroke-width="2.2"/>
  <ellipse cx="200" cy="72" rx="16" ry="12"
           fill="#050215" stroke="#7a3ab0" stroke-width="1.6"/>
  <!-- Vertical slit pupil -->
  <ellipse cx="200" cy="72" rx="5"   ry="10" fill="#010008"/>
  <ellipse cx="200" cy="72" rx="2.5" ry="7.5" fill="#2a0050"/>
  <ellipse cx="200" cy="72" rx="1.2" ry="5"
           fill="#aa44ff" filter="url(#glow)" opacity="0.95"/>
  <!-- Pupil glint -->
  <circle cx="197" cy="68" r="1.8" fill="#dd88ff" opacity="0.7"/>

  <!-- ── Tentacles ──────────────────────────────────────────────────────── -->
  <!-- Tentacle 1: upper-left -->
  <path d="M 196,52 C 178,36 148,28 126,42 C 115,50 120,62 128,58"
        stroke="#5a2a90" stroke-width="4.2" fill="none" stroke-linecap="round"
        filter="url(#glow)" opacity="0.88"/>
  <!-- Tentacle 2: left, curling down -->
  <path d="M 192,78 C 168,84 144,96 138,120 C 134,132 142,138 147,130"
        stroke="#5a2a90" stroke-width="3.6" fill="none" stroke-linecap="round" opacity="0.80"/>
  <!-- Tentacle 3: upper-right -->
  <path d="M 204,52 C 222,36 252,28 274,42 C 285,50 280,62 272,58"
        stroke="#5a2a90" stroke-width="4.2" fill="none" stroke-linecap="round"
        filter="url(#glow)" opacity="0.88"/>
  <!-- Tentacle 4: right, curling down -->
  <path d="M 208,78 C 232,84 256,96 262,120 C 266,132 258,138 253,130"
        stroke="#5a2a90" stroke-width="3.6" fill="none" stroke-linecap="round" opacity="0.80"/>
  <!-- Tentacle 5: downward centre -->
  <path d="M 200,92 C 197,108 205,122 200,134 C 197,140 193,138 195,133"
        stroke="#5a2a90" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.72"/>
  <!-- Tentacle 6: far left, lower -->
  <path d="M 188,82 C 158,95 132,118 130,140 C 128,148 134,150 138,144"
        stroke="#3a1a70" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0.60"/>
  <!-- Tentacle 7: far right, lower -->
  <path d="M 212,82 C 242,95 268,118 270,140 C 272,148 266,150 262,144"
        stroke="#3a1a70" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0.60"/>

  <!-- Sucker dots -->
  <g fill="#8844cc" opacity="0.55">
    <circle cx="162" cy="36" r="3.2"/>
    <circle cx="142" cy="50" r="2.8"/>
    <circle cx="155" cy="108" r="2.8"/>
    <circle cx="238" cy="36" r="3.2"/>
    <circle cx="258" cy="50" r="2.8"/>
    <circle cx="245" cy="108" r="2.8"/>
    <circle cx="200" cy="118" r="2.8"/>
  </g>

  <!-- ── Volcano plot (DEG visualization) ────────────────────────────────── -->
  <!-- Bounds: x 108–292, y 158–272 -->

  <!-- Threshold lines -->
  <line x1="108" y1="228" x2="292" y2="228"
        stroke="#2a1a40" stroke-width="0.9" stroke-dasharray="4,3" opacity="0.80"/>
  <line x1="200" y1="158" x2="200" y2="272"
        stroke="#2a1a40" stroke-width="0.9" stroke-dasharray="4,3" opacity="0.80"/>
  <line x1="155" y1="158" x2="155" y2="272"
        stroke="#2a1a40" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.45"/>
  <line x1="245" y1="158" x2="245" y2="272"
        stroke="#2a1a40" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.45"/>

  <!-- Background / not-significant genes (muted purple-grey) -->
  <g fill="#3a2858" opacity="0.65">
    <circle cx="187" cy="252" r="2.2"/>
    <circle cx="198" cy="247" r="2.2"/>
    <circle cx="209" cy="254" r="2.2"/>
    <circle cx="176" cy="250" r="2.2"/>
    <circle cx="217" cy="248" r="2.2"/>
    <circle cx="192" cy="242" r="2.2"/>
    <circle cx="212" cy="243" r="2.2"/>
    <circle cx="172" cy="257" r="2.2"/>
    <circle cx="222" cy="256" r="2.2"/>
    <circle cx="184" cy="237" r="2.2"/>
    <circle cx="218" cy="238" r="2.2"/>
    <circle cx="167" cy="247" r="2.2"/>
    <circle cx="227" cy="246" r="2.2"/>
    <circle cx="158" cy="254" r="2.2"/>
    <circle cx="237" cy="252" r="2.2"/>
    <circle cx="148" cy="250" r="2.2"/>
    <circle cx="247" cy="250" r="2.2"/>
    <circle cx="181" cy="231" r="2"/>
    <circle cx="201" cy="230" r="2"/>
    <circle cx="221" cy="231" r="2"/>
    <circle cx="162" cy="240" r="2"/>
    <circle cx="242" cy="239" r="2"/>
    <circle cx="175" cy="226" r="1.8"/>
    <circle cx="225" cy="225" r="1.8"/>
  </g>

  <!-- Down-regulated DEGs (blue, left quadrant, high significance) -->
  <g fill="#4C9BE8" filter="url(#glow)" opacity="0.90">
    <circle cx="130" cy="188" r="3.2"/>
    <circle cx="118" cy="172" r="3.2"/>
    <circle cx="140" cy="174" r="3.2"/>
    <circle cx="113" cy="195" r="2.8"/>
    <circle cx="126" cy="163" r="2.8"/>
    <circle cx="138" cy="162" r="2.8"/>
    <circle cx="108" cy="180" r="2.8"/>
    <circle cx="144" cy="192" r="2.8"/>
    <circle cx="120" cy="207" r="2.5"/>
    <circle cx="132" cy="202" r="2.5"/>
    <circle cx="150" cy="198" r="2.2"/>
    <circle cx="124" cy="218" r="2.2"/>
    <circle cx="142" cy="212" r="2.2"/>
  </g>

  <!-- Up-regulated DEGs (red, right quadrant, high significance) -->
  <g fill="#E8604C" filter="url(#glow)" opacity="0.90">
    <circle cx="270" cy="188" r="3.2"/>
    <circle cx="282" cy="172" r="3.2"/>
    <circle cx="260" cy="174" r="3.2"/>
    <circle cx="287" cy="195" r="2.8"/>
    <circle cx="274" cy="163" r="2.8"/>
    <circle cx="262" cy="162" r="2.8"/>
    <circle cx="292" cy="180" r="2.8"/>
    <circle cx="256" cy="192" r="2.8"/>
    <circle cx="280" cy="207" r="2.5"/>
    <circle cx="268" cy="202" r="2.5"/>
    <circle cx="250" cy="198" r="2.2"/>
    <circle cx="276" cy="218" r="2.2"/>
    <circle cx="258" cy="212" r="2.2"/>
  </g>

  <!-- Axis labels -->
  <text x="200" y="282" font-family="'Courier New',monospace" font-size="7.5"
        fill="#3a2a60" text-anchor="middle">log₂ fold change</text>
  <text x="99" y="215" font-family="'Courier New',monospace" font-size="7"
        fill="#3a2a60" text-anchor="middle"
        transform="rotate(-90, 99, 215)">−log₁₀(p)</text>
  <!-- Quadrant labels -->
  <text x="130" y="154" font-family="'Courier New',monospace" font-size="8"
        fill="#4C9BE8" text-anchor="middle" opacity="0.85">down</text>
  <text x="270" y="154" font-family="'Courier New',monospace" font-size="8"
        fill="#E8604C" text-anchor="middle" opacity="0.85">up</text>

  <!-- Separator -->
  <line x1="108" y1="295" x2="292" y2="295" stroke="#1a0a30" stroke-width="0.8"/>

  <!-- Tool name with colour-coded segments -->
  <text x="200" y="322"
        font-family="'Courier New',Courier,monospace"
        font-size="27" font-weight="bold"
        text-anchor="middle" letter-spacing="1.5"
        filter="url(#textglow)">
    <tspan fill="#d8ccff">Nya</tspan><tspan fill="#4C9BE8">RNA</tspan><tspan fill="#d8ccff">tho</tspan><tspan fill="#E8604C">DEG</tspan>
  </text>

  <text x="200" y="344"
        font-family="'Courier New',Courier,monospace"
        font-size="9.5" fill="#4a3878"
        text-anchor="middle" letter-spacing="1.2">RNA-seq  ·  DEG  ·  GO enrichment</text>

</svg>
