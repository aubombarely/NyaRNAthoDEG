<svg xmlns="http://www.w3.org/2000/svg" width="260" height="80" viewBox="0 0 260 80">

  <!-- Background -->
  <rect width="260" height="80" rx="9" fill="#16213e"/>

  <!-- Left accent panel -->
  <rect width="72" height="80" rx="9" fill="#0f3460"/>
  <rect x="63" width="9" height="80" fill="#0f3460"/>

  <!-- ── RNA helix (two strands + base-pair rungs) ── -->
  <!-- Strand 1 -->
  <path d="M 8 16 Q 20 6  32 16 Q 44 26 56 16 Q 64 9  71 13"
        stroke="#4C9BE8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Strand 2 -->
  <path d="M 8 36 Q 20 26 32 36 Q 44 46 56 36 Q 64 29 71 33"
        stroke="#4C9BE8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Base-pair rungs -->
  <line x1="18" y1="11" x2="18" y2="31" stroke="#F5A623" stroke-width="1.4" opacity="0.85"/>
  <line x1="32" y1="16" x2="32" y2="36" stroke="#F5A623" stroke-width="1.4" opacity="0.85"/>
  <line x1="46" y1="21" x2="46" y2="31" stroke="#F5A623" stroke-width="1.4" opacity="0.85"/>
  <line x1="60" y1="16" x2="60" y2="28" stroke="#F5A623" stroke-width="1.4" opacity="0.85"/>
  <!-- Strand end nodes -->
  <circle cx="8"  cy="16" r="2.8" fill="#4C9BE8"/>
  <circle cx="8"  cy="36" r="2.8" fill="#4C9BE8"/>
  <circle cx="71" cy="13" r="2.2" fill="#4C9BE8" opacity="0.7"/>
  <circle cx="71" cy="33" r="2.2" fill="#4C9BE8" opacity="0.7"/>

  <!-- ── Tentacle (Nyarlathotep reference) ── -->
  <path d="M 9 56 C 17 51 25 61 33 56 C 41 51 49 61 57 56 C 62 53 66 57 69 55"
        stroke="#E8604C" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- Tentacle tip curl -->
  <path d="M 69 55 C 72 53 74 56 72 58"
        stroke="#E8604C" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Small sucker dots -->
  <circle cx="20" cy="58" r="1.5" fill="#E8604C" opacity="0.5"/>
  <circle cx="36" cy="55" r="1.5" fill="#E8604C" opacity="0.5"/>
  <circle cx="52" cy="58" r="1.5" fill="#E8604C" opacity="0.5"/>

  <!-- ── Tool name (color-coded) ── -->
  <!-- "Nya" -->
  <text x="82" y="37"
        font-family="'Courier New', Courier, monospace"
        font-size="21" font-weight="bold" fill="#ffffff">Nya</text>
  <!-- "RNA" — highlighted in pipeline blue -->
  <text x="122" y="37"
        font-family="'Courier New', Courier, monospace"
        font-size="21" font-weight="bold" fill="#4C9BE8">RNA</text>
  <!-- "tho" -->
  <text x="162" y="37"
        font-family="'Courier New', Courier, monospace"
        font-size="21" font-weight="bold" fill="#ffffff">tho</text>
  <!-- "DEG" — highlighted in DE red -->
  <text x="202" y="37"
        font-family="'Courier New', Courier, monospace"
        font-size="21" font-weight="bold" fill="#E8604C">DEG</text>

  <!-- ── Subtitle ── -->
  <text x="82" y="53"
        font-family="Arial, Helvetica, sans-serif"
        font-size="9.5" fill="#888888" letter-spacing="0.6">RNA-seq end-to-end pipeline</text>

  <!-- ── Version badge ── -->
  <rect x="82" y="59" width="42" height="14" rx="3" fill="#4C9BE8" opacity="0.85"/>
  <text x="103" y="69"
        font-family="Arial, Helvetica, sans-serif"
        font-size="8.5" font-weight="bold" fill="white"
        text-anchor="middle">v0.1.0</text>

  <!-- ── Thin border ── -->
  <rect width="260" height="80" rx="9" fill="none"
        stroke="#4C9BE8" stroke-width="0.8" opacity="0.4"/>

</svg>
